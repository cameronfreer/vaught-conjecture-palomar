name = "VaughtConjecturePalomar"
version = "0.1.0"
license = "Apache-2.0"
defaultTargets = ["Palomar.Solution"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
backward.privateInPublic = false
# Preserve upstream proof terms using still-supported deprecated aliases.
# This suppresses naming notices only, never admission or kernel checks.
linter.deprecated = false
# Keep source-style linting separate from proof compilation and axiom auditing.
linter.all = false

# Canonical Mathlib only. The additional infinitary syntax/semantics leaves are
# attributed proof-owned source modules, never an overlay on Mathlib's namespace.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "c55e6e786f49471c72fbddbec5415808896aec1e"

# Blueprint attributes occur in the selected proof sources.
[[require]]
name = "LeanArchitect"
git = "https://github.com/hanwenzhu/LeanArchitect"
rev = "f45833e26c68aa947044145184f8881a75392e30"

# Architect uses the former repository spelling; retain Mathlib's canonical
# dependency identity and exact revision in the shared manifest.
[[require]]
name = "Cli"
git = "https://github.com/leanprover/lean4-cli"
rev = "843844fa601dd56767b1eb22b7ada5b64d5e567a"

[[lean_lib]]
name = "Palomar"
globs = ["Palomar.*"]

[[lean_lib]]
name = "PalomarProof"
globs = ["PalomarProof.*"]
leanOptions = { warningAsError = true }

[[lean_lib]]
name = "InfinitaryLogic"
globs = ["InfinitaryLogic.*"]
# Preserve upstream IL's implicit-parameter settings; the project libraries
# retain their original stricter settings above.
leanOptions = { autoImplicit = true, relaxedAutoImplicit = true, warningAsError = true }

[[lean_lib]]
name = "VaughtConjecture"
globs = ["VaughtConjecture.*"]
leanOptions = { warningAsError = true }

[[lean_lib]]
name = "Tests"
globs = ["Tests.*"]
leanOptions = { warningAsError = true }
