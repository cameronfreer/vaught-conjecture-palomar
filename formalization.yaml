version: "v0.4"

project:
  name: "A counterexample to Vaught's conjecture for infinitary logic"
  description: >-
    There is a counterexample to Vaught's conjecture for L_{omega_1,omega}.
    This formalization is based on an unpublished draft by Robin Knight.
    It constructs a sentence in a countable relational language with exactly
    aleph-one isomorphism classes of countable models and no nonempty perfect
    set of pairwise nonisomorphic model codes. This is not a counterexample to
    the first-order Vaught conjecture.
  authors:
    - Nathanael Ackerman
    - Cameron Freer
    - Robin Knight
  responsible_maintainers:
    - Cameron Freer
  license: Apache-2.0

contribution_statement: >-
  The Lean formalization was carried out by Cameron Freer in collaboration with
  Nathanael Ackerman and Robin Knight. The construction is based on an unpublished
  draft by Robin Knight.

sources:
