# Palomar version 1 registers source commit 032ccb7a25b0ff6227128aa0aeba549c5901ea9a.
# See docs/evidence/palomar-registration.md; later commits are distinct snapshots.
version: "v0.4"

project:
  name: "A counterexample to Vaught's conjecture for infinitary logic"
  description: >-
    There is a counterexample to Vaught's conjecture for L_{omega_1,omega}.
    This formalization is based on an unpublished draft by Robin Knight.
    It constructs a sentence in a countable relational language with exactly
    aleph-one isomorphism classes of countable models and no nonempty perfect
    set of pairwise nonisomorphic model codes. This is not a counterexample to
    the first-order Vaught conjecture.
  authors:
    - Nathanael Ackerman
    - Cameron Freer
    - Robin Knight
  responsible_maintainers:
    - Cameron Freer
  license: Apache-2.0

contribution_statement: >-
  The Lean formalization was carried out by Cameron Freer in collaboration with
  Nathanael Ackerman and Robin Knight. The construction is based on an unpublished
  draft by Robin Knight.

sources:
  - title: "Unpublished draft on a counterexample to infinitary Vaught's conjecture"
    authors:
      - Robin Knight
    year: 2026
    type: paper
    relationship: formalizes
    author_endorsement: participated
    note: >-
      Unpublished, nonpublic manuscript. Formalizes the key result and general
      approach of an unpublished draft by Robin Knight, incorporating new ideas
      developed through human–AI interaction.

related_formalizations:
  - id: https://github.com/cameronfreer/infinitary-logic
    relationship: builds-on
    note: >-
      Supplies the reused infinitary model-theory infrastructure. Selected sources
      are bundled in this package; their upstream revisions, licenses,
      hashes and transformations are recorded in the source-provenance manifest.

classification:
  arxiv:
    - math.LO
  msc2020:
    - "03C15"
    - "03C75"
    - "03E15"

automation:
  methods:
    - method: manual
      tool_setup: "Human mathematical collaboration and direction of the formalization."
    - method: agent
      tool_setup: >-
        GPT models from 5.2 through 6 and Claude models from Opus 4.5 through
        Fable 5.1 and Opus 5.5. Initially used for proof implementation following
        Knight's manuscript; later models were also used for mathematical
        exploration, counterexample search, refactoring, documentation, and review.
  notes: >-
    SMT and Horn solvers were used in the course of finding the proof, but do not
    play a role in the final formalization.

review:
  status: agent-reviewed
  notes: >-
    Human mathematical direction and review, with agent-assisted implementation
    and source review.
    The migrated standalone package passed local proof-module compilation,
    strict Solution compilation, a transitive standard-axiom audit of the theorem
    and its two adapters, Comparator, NanoDa, Con-Ron and Lean kernel replay, and
    both negative controls. A separate checkout with no project build artifacts
    passed the native Lake build using the pinned public dependency cache.
    Palomar version 1 records mechanical verification and an automated editorial
    review of source commit 032ccb7a25b0ff6227128aa0aeba549c5901ea9a.
    No independent human mathematical review is claimed here.

status:
  scope: >-
    A standalone extraction of the proof developed in the authors' private working
    development. The module-system migration and local verification are complete;
    native clean-project reproduction and publication review are complete.
    Source commit 032ccb7a25b0ff6227128aa0aeba549c5901ea9a was registered as
    PALOMAR-2026-10-07-000001, version 1, on October 7, 2026:
    https://palomar-registry.org/entry?id=PALOMAR-2026-10-07-000001&version=1.
    This status update does not change the immutable registered snapshot.
