name: Palomar full mechanical preflight

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character public commit to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      request_id: ${{ steps.select.outputs.request_id }}
    steps:
      - name: Require a public immutable snapshot
        id: select
        env:
          COMMIT: ${{ inputs.commit }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE" == false ]] || { echo 'Publication approval is required first.' >&2; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
          request_id=$(printf '%s:%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | sha256sum | cut -c1-12)
          printf 'request_id=%s\n' "$request_id" >> "$GITHUB_OUTPUT"

  verify:
    needs: select
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ inputs.commit }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: ${{ needs.select.outputs.request_id }}
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"authorization_relationship":"I am a responsible author or maintainer","comparator_config_path":"comparator.json","formalization_metadata_path":"formalization.yaml"}'
